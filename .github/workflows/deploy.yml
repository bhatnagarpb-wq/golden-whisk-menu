name: Build and deploy cake board


# Deliberately NOT triggered on push to main. There's no separate staging
# environment on GitHub's side — merging is the last gate before this
# workflow would touch the live domain, and "CI passed" isn't the same
# as "someone looked at it." So deploys are manual: after merging (and
# reviewing on local staging beforehand), run
#   gh workflow run deploy.yml --repo bhatnagarpb-wq/golden-whisk-menu
# or use the "Run workflow" button under the Actions tab.
on:
  workflow_dispatch: {}

# Least-privilege by default: nothing is writable at the workflow level.
# Each job below grants itself only the specific permission it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node ships preinstalled on GitHub's ubuntu-latest runner; this just
      # pins the version verify.py's `node --check` calls run against.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the page
        run: python3 build/generate.py

      - name: Verify the build
        run: python3 scripts/verify.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
